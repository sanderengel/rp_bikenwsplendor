[project]
authors = [{name = "sanderengel", email = "saet@itu.dk"}]
dependencies = []
name = "splendor"
requires-python = ">= 3.11"
version = "0.1.0"

[build-system]
build-backend = "hatchling.build"
requires = ["hatchling"]

[tool.hatch.build.targets.wheel]
packages = ["src/splendor"]

[tool.pixi.workspace]
channels = ["conda-forge"]
platforms = ["osx-arm64"]

[tool.pixi.pypi-dependencies]
splendor = { path = ".", editable = true }

[tool.pixi.tasks]
lab = "jupyter lab"
test = "pytest"

[tool.pixi.dependencies]
python = "3.12.*"
geopandas = ">=1.2.0,<2"
shapely = ">=2.2.0,<3"
pyogrio = ">=0.13.0,<0.14"
python-igraph = ">=1.0.0,<2"
networkx = ">=3.7,<4"
numpy = ">=2.5.4,<3"
scipy = ">=1.18.1,<2"
pandas = ">=3.1.0,<4"
matplotlib = ">=3.11.2,<4"
pyyaml = ">=6.0.3,<7"
jupyterlab = ">=4.6.4,<5"
ipykernel = ">=7.4.0,<8"
pytest = ">=9.1.1,<10"
pip = ">=26.2.2,<27"
